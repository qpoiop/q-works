<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ task.open }}" style="display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:#fff;border:1px solid #eceef1;border-radius:14px;cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .1s;box-shadow:0 1px 2px rgba(16,24,40,.04);opacity:{{ task.cardOpacity }}" style-hover="border-color:#d0d5dd;box-shadow:0 6px 18px rgba(16,24,40,.09);transform:translateY(-1px)">
  <button onClick="{{ task.toggleStatus }}" title="{{ task.checkTitle }}" style="flex:none;margin-top:1px;width:24px;height:24px;border-radius:50%;border:2px solid {{ task.checkBorder }};background:{{ task.checkBg }};color:{{ task.checkMarkColor }};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1;cursor:{{ task.checkCursor }};padding:0;transition:all .15s" style-hover="{{ task.checkHover }}">✓</button>
  <div style="flex:1;min-width:0">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="flex:none;width:7px;height:7px;border-radius:50%;background:{{ task.priorityColor }}"></span>
      <span style="font-size:15px;font-weight:600;color:#1a1d21;text-decoration:{{ task.titleDeco }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ task.title }}</span>
      <span style="flex:none;margin-left:auto;display:flex;gap:6px;align-items:center">
        <sc-if value="{{ task.locked }}" hint-placeholder-val="{{ false }}"><span title="다른 담당자가 편집을 제한함" style="font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#f2f3f5;color:#9aa0aa">잠김</span></sc-if>
        <span style="font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:{{ task.pubBg }};color:{{ task.pubColor }}">{{ task.pubLabel }}</span>
      </span>
    </div>
    <sc-if value="{{ task.hasContent }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:4px;font-size:13px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ task.content }}</div>
    </sc-if>
    <div style="display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap">
      <span style="font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:{{ task.dueBg }};color:{{ task.dueColor }}">{{ task.dueLabel }}</span>
      <span style="font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:{{ task.statusBg }};color:{{ task.statusColor }}">{{ task.statusLabel }}</span>
      <sc-for list="{{ task.tags }}" as="tag" hint-placeholder-count="1">
        <span style="font-size:11px;color:#6b7280;background:#f2f3f5;padding:3px 7px;border-radius:6px">#{{ tag }}</span>
      </sc-for>
      <span style="margin-left:auto;display:inline-flex;align-items:center;gap:6px">
        <span style="flex:none;width:22px;height:22px;border-radius:50%;background:{{ task.avatarColor }};color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ task.avatarInitial }}</span>
        <span style="font-size:12px;color:#4b5563;font-weight:500">{{ task.assignee }}</span>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:112},&quot;task&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;}}"></script>
</body>
</html>
